{% extends "base.html" %}

{% block content %}
  <h1>{% if object %}Modifier{% else %}Ajouter{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Enregistrer</button>
    <a class="btn secondary" href="{{ request.META.HTTP_REFERER }}">Annuler</a>
  </form>
{% endblock %}
