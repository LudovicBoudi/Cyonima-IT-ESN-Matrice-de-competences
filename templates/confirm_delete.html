{% extends "base.html" %}

{% block content %}
  <h1>Confirmer la suppression</h1>
  <p>Voulez-vous vraiment supprimer « {{ object }} » ?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn danger">Supprimer</button>
    <a class="btn secondary" href="{{ request.META.HTTP_REFERER }}">Annuler</a>
  </form>
{% endblock %}
