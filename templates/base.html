<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GPEC-IT{% endblock %}</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1c1f24;
      --border: #2a2e35;
      --text: #e6e8eb;
      --muted: #9aa0a6;
      --accent: #4f8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1rem;
      flex-shrink: 0;
    }
    .sidebar .brand {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }
    .sidebar nav a {
      display: block;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      text-decoration: none;
      border-radius: 6px;
      margin-bottom: 0.25rem;
    }
    .sidebar nav a:hover { background: var(--border); }
    .content { flex: 1; padding: 2rem; }
    h1 { margin-top: 0; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
    .cards { display: flex; gap: 1rem; margin-bottom: 2rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.5rem;
    }
    .card .num { font-size: 1.75rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">GPEC-IT</div>
      <nav>
        <a href="{% url 'home' %}">Accueil</a>
        <a href="{% url 'admin:index' %}">Administration</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
