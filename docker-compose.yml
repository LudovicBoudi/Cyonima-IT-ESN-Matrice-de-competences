services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gpec_it
      POSTGRES_USER: gpec
      POSTGRES_PASSWORD: gpec
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpec -d gpec_it"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DB_ENGINE: postgres
      POSTGRES_DB: gpec_it
      POSTGRES_USER: gpec
      POSTGRES_PASSWORD: gpec
      POSTGRES_HOST: db
      DJANGO_SECRET_KEY: change-me-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles

volumes:
  pgdata:
  staticfiles:
